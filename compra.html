<!--
- Contenido principal (Main) con:
  - Título de la página
  - Contenedor principal con dos columnas:
    - Columna izquierda: Formulario de checkout
      - Información personal
      - Dirección
      - Consentimiento de datos
      - Método de envío
      - Método de pago
      - Botón de pago
    - Columna derecha: Resumen de carrito dinámico
      - Lista de productos en el carrito
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout </title>
  <link rel="stylesheet" href="css/compra.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Satisfy&family=Tauri&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barriecito&display=swap" rel="stylesheet">

  <script src="js/cart.js" defer></script>
  <script src="js/header.js" defer></script>
</head>


<body>

  <header class="Header">
    <div class="Header-menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list"
        viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
      </svg>
    </div>
    <nav class="Header-nav">
      <ul class="Header-ul">
        <li class="Header-li"><a href="index.html#ingredients" class="Header-a">Ingredients</a></li>
        <li class="Header-li"><a href="index.html#buy" class="Header-a">Shop</a></li>
        <li class="Header-li"><a href="index.html#Story" class="Header-a">Our Story</a></li>
      </ul>
      <div class="Header-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="Header-arrow"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
        </svg>
        <span class="Header-span">Go back</span>
      </div>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="Checkout-main">
    <h2 class="Checkout-title">CHECKOUT</h2>

    <div class="Checkout-wrapper">

      <!-- COLUMNA IZQUIERDA: FORMULARIO -->
      <section class="Checkout-form">
        <form>

          <!-- Información personal -->
          <div class="Form-section">
            <h3 class="Form-section--h3">Personal Information</h3>
            <input type="text" placeholder="First name" required >
            <input type="text" placeholder="Last name" required >
            <input type="tel" placeholder="Phone number" required >
            <input type="email" placeholder="Email" required >
          </div>

          <!-- Dirección -->
          <div class="Form-section">
            <h3 class="Form-section--h3">Shipping Information</h3>
            <input type="text" placeholder="Country / Region" required >
            <input type="text" placeholder="City" required >
            <input type="text" placeholder="Address" required >
            <input type="text" placeholder="Zip / Postal code" required >
          </div>

          <label class="Form-consent">
            <input class="Form-section--checkbox" type="checkbox" required >
            I agree to data processing
          </label>

          <!-- Envío -->
          <div class="Form-section">
            <h3 class="Form-section--h3">Delivery</h3>
            <label><input type="radio" name="delivery" > Standard Delivery (5–7 days) – Free</label>
            <label><input type="radio" name="delivery" > Express Shipping (1–2 days) – $50.00</label>
          </div>

          <!-- Pago -->
          <div class="Form-section">
            <h3 class="Form-section--h3">Payment</h3>

            <label><input type="radio" name="payment" value="card" checked > Credit card</label>
            <input type="text" placeholder="Card number" required >
            <input type="text" placeholder="Cardholder name" required >
            <input type="text" placeholder="Expiration date (MM/YY)" required >
            <input type="text" placeholder="CVV" required >

            <label><input type="radio" name="payment" value="paypal" > PayPal</label>
            <label><input type="radio" name="payment" value="applepay" > Apple Pay</label>
          </div>

          <button type="submit" class="Checkout-button">PAY AND PLACE ORDER</button>
        </form>
      </section>

      <!-- COLUMNA DERECHA: ARTÍCULOS DINÁMICOS -->
      <aside class="Cart-summary">

        <h3 class="Form-section--h3">Shopping Bag</h3>

        <!-- AQUÍ SE INSERTAN LOS PRODUCTOS DINÁMICOS -->
        <section class="Cart-container" id="cartContainer"></section>




      </aside>
    </div>
  </main>
 <footer class="Footer">
    <div class="Footer-grid">
      <div class="Footer-item Footer-item--copy">
        <p class="Footer-item--text">Bold flavors.
          <br>
          Creative experiences.
        </p>
        <div class="Footer-item--text Footer-item--madeby">
          <span>Made by</span>
          <img src="assets/logo.svg" alt="soji logo" class="Footer-logo">
        </div>
      </div>
       <div class="Footer-item Footer-item--links">
        <a href="index.html#ingredients" class="Footer-link">Ingredients</a>
        <a href="index.html#buy" class="Footer-link">Shop</a>
        <a href="index.html#Story" class="Footer-link">Our Story</a>
      </div>
      <div class="Footer-item Footer-item--social">
        <div class="Footer-social--h4"> Social</div>
        <div class="Footer-social-links">
          <a href="" class="Footer-social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-instagram"
              viewBox="0 0 16 16">
              <path
                d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334" />
            </svg> </a>
          <a href="" class="Footer-social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook"
              viewBox="0 0 16 16">
              <path
                d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951" />
            </svg>
          </a>
          <a href="" class="Footer-social-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-twitter-x"
              viewBox="0 0 16 16">
              <path
                d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z" />
            </svg> </a>
        </div>
      </div>

    </div>
    <div class="Footer-copyright">
      <p class="Footer-copyright--p">
        © 2026 Soji. All Rights Reserved.
      </p>
    </div>
  </footer>
</body>

</html>
